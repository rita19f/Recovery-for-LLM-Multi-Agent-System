name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Small-map preflight
        run: >-
          python3 scripts/run_experiment.py
          maps/development/shared_static_traps_small.json
          --validate-only --planning-granularity chunk --chunk-size 3
      - name: Asymmetric-map preflight
        run: >-
          python3 scripts/run_experiment.py
          maps/development/shared_asymmetric_crossing.json
          --validate-only --planning-granularity chunk --chunk-size 3
      - name: Evaluation base preflight
        run: >-
          python3 scripts/run_experiment.py
          maps/evaluation/coincident_detours.json
          --validate-only --planning-granularity chunk --chunk-size 3
      - name: Evaluation portal preflight
        run: >-
          python3 scripts/run_experiment.py
          maps/evaluation/three_portal_exchange.json
          --validate-only --planning-granularity chunk --chunk-size 3
      - name: Evaluation staged preflight
        run: >-
          python3 scripts/run_experiment.py
          maps/evaluation/staged_crossing.json
          --validate-only --planning-granularity chunk --chunk-size 3

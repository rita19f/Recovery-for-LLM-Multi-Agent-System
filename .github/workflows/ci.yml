name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce evaluation maps
        run: python scripts/generate_evaluation_maps.py --output maps/evaluation --check
      - name: Full evaluation rehearsal
        run: >-
          python scripts/run_batch.py configs/evaluation_batch.json
          --backend dry-run --repetitions 1 --execute
          --output-root /tmp/rehearsal
